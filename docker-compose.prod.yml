services:
  backend:
    profiles: ["app"]
    environment:
      APP_ENV: production
      DEBUG: "false"
      USE_REDIS_RATE_LIMIT: "true"
      AI_MODE: strict_private
    restart: unless-stopped

  worker:
    profiles: ["app"]
    environment:
      APP_ENV: production
      AI_MODE: strict_private
      HF_TOKEN: ${HF_TOKEN:-}
n    restart: unless-stopped

  postgres:
    restart: unless-stopped
  redis:
    restart: unless-stopped
  qdrant:
    restart: unless-stopped
  minio:
    restart: unless-stopped
  ollama:
    restart: unless-stopped
