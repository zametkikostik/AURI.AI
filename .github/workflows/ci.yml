name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Verify backend files
        run: |
          test -f requirements.txt
          test -d app
          echo "backend/requirements.txt present"
          wc -l requirements.txt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio httpx

      - name: Lint
        run: ruff check app || true

      - name: Syntax check
        run: python -m compileall -q app

      - name: Unit tests (no DB)
        run: |
          pytest tests/test_e2e_api.py -q -k "plan_limits or chunking or health" --tb=short || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Verify frontend files
        run: |
          test -f package.json
          test -d app
          echo "frontend/package.json present"
          cat package.json | head -20

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit || true

      - name: Lint
        run: npm run lint || true

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build || true

  smoke-compose:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Verify compose file
        run: test -f docker-compose.yml

      - name: Start infrastructure
        run: |
          docker compose up -d postgres redis minio qdrant
          sleep 15
          docker compose ps

      - name: Health probe (infra)
        run: |
          docker compose exec -T postgres pg_isready -U auri -d auri
          docker compose exec -T redis redis-cli ping
